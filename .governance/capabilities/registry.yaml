    category: governance
    operation_type: validate
    mutating: false
    idempotency: guaranteed
    description_extended: >
      Reports current parity status across all agent surfaces.
      Reads skills/registry.yaml and compares .claude/commands/, .agents/skills/,
      .kilocode/skills/ for completeness.

  S-112:
    category: governance
    operation_type: orchestrate
    mutating: true
    idempotency: guaranteed
    description_extended: >
      Runs full sync pipeline: inventory → validate → generate → update indexes
      → detect drift → validate parity → emit reports.

  S-113:
    category: governance
    operation_type: validate
    mutating: false
    idempotency: guaranteed
    description_extended: >
      Validates semantic parity across all adapter surfaces.
      Emits .governance/generated/parity-report.yaml.

  S-114:
    category: governance
    operation_type: validate
    mutating: false
    idempotency: guaranteed
    description_extended: >
      Detects stale generated adapters by hashing canonical bodies and comparing
      to deployed adapters. Emits .governance/generated/drift-report.yaml.

  S-115:
    category: governance
    operation_type: generate
    mutating: true
    idempotency: guaranteed
    description_extended: >
      Scaffolds a new capability: creates canonical skill contract, updates registry,
      generates Claude command adapter, generates agent skill adapter.

