# .governance/capabilities/registry.yaml
# Capability contract registry — extends skills/registry.yaml with rich contract metadata.
#
# Canonical source of truth: skills/registry.yaml
# This file EXTENDS (not replaces) that registry with:
#   - supported_agents: which agents can execute each capability
#   - operation_type: read-only | write | generate | validate | orchestrate | migrate
#   - mutating: whether the capability changes tracked files
#   - category: governance | knowledge | content | quality | translation | orchestration | utility
#   - idempotency: guaranteed | best-effort | not-guaranteed
#
# Do not edit skill names, IDs, descriptions, or scripts here — edit skills/registry.yaml.
# Run: python tools/capability_sync/run_sync.py to regenerate generated/ artifacts.

schema_version: 1
generated_from: skills/registry.yaml
supported_agents:
  - CLAUDE_CODE
  - CODEX
  - KILO_CODE
  - GENERIC_AGENT
  - CI
  - SUPERVISOR

adapter_roots:
  claude_code: .claude/commands/
  codex: .agents/skills/
  kilocode: .kilocode/skills/
  canonical: skills/

# ---------------------------------------------------------------------------
# Per-capability contract extensions (keyed by skill ID)
# All fields here are ADDITIONS to what skills/registry.yaml provides.
# ---------------------------------------------------------------------------

capability_metadata:

  # ── Governance ─────────────────────────────────────────────────────────────

  S-01:
    category: governance
    operation_type: validate
    mutating: false
    idempotency: guaranteed
    description_extended: Enforce allowed write paths against configurable allowlist and denylist.
    preconditions:
      - path_guard.py must be on PYTHONPATH
    failure_contract: exits 2 on DENY; exits 0 on ALLOW

