mission_authority:
  mission_id: MT013-2026-07-28-PDF-PYTHON-LAUNCH
  mission_summary: "Launch pdf/python (Aspose.PDF FOSS for Python) across all 5 aspose.org subdomains. No dedicated Track A' hardening expected -- Python is the most exercised extractor in this pipeline with no known language-specific gaps, and live inspection of the real repo (pyproject.toml, README) confirms pdf/python is a full native Python reimplementation, not a pybind11/cffi/ctypes binding over the pdf/cpp core (dependencies are pure Python: cryptography, asn1crypto). Third and final of three sequential launches (cells/go -> pdf/cpp -> pdf/python) queued by the discover-more-products-to-launch mission (2026-07-28, commit 68336dd63f), continued per MT011 (cells/go, CLOSED) and MT012 (pdf/cpp, CLOSED, including its Phase 7 cells/cpp blog_done correction). Each mission gets its own MISSION_AUTHORITY.yaml contract when it starts (this file governs Mission 3 only)."
  governing_plan_path: "plans/master-plan.md#Mission:-MT013-2026-07-28-PDF-PYTHON-LAUNCH"
  current_phase: CLOSED
  closure_summary: "pdf/python launched across all 5 subdomains (247 pages: 1 products, 15 docs, 12 kb, 4 blog, 215 reference). Real pipeline bug found and fixed before content generation: batch_reference.py's same-name namespace disambiguation silently re-collided Python's flatter module paths (canonical_namespace was never populated for Python classes; the last-dot-segment truncation then re-collided leaf-name matches like aspose_pdf.document vs aspose_pdf.generated.document) -- root-caused across 3 files (api_surface.py, package_manifest.py, batch_reference.py) with regression tests, preserving the existing .NET-style short-suffix contract via a new adaptive fallback helper. truth-audit: 0 FAIL. content_eval: 46 FAIL, all triaged to 2 known formats.json extraction gaps (PDF mismarked enum_only/functional:false; PNG entry missing) plus 6 isolated reference-page member-doc coverage gaps -- 0 fabricated or false claims. S-90 verdict: PUBLISH. Readiness scorecard: READY TO SHIP, all H01-H05 PASS. 7 governed commits pushed (pipeline, products, docs, kb, blog, reference, websites.aspose.org sync). Full pipeline regression suite: 7865 passed / 45 failed, all pre-existing/environment-dependent, 0 regressions from this mission. This closes the 3-mission plan (cells/go -> pdf/cpp -> pdf/python) in full. Follow-ups filed to backlog: PDFPY-FORMATSGAP-001, PDFPY-GENSHADOW-001, PDFPY-CNSRISK-001, PDFPY-MEMBERDOC-001, PIPETEST-PREEXIST-001."
  in_scope_outcomes:
    - "Binding-vs-full-port verification with live evidence (completed pre-contract: confirmed full native Python port via pyproject.toml/README inspection) -- no further Track A' work needed on this question"
    - "pdf/python registered (already active in data/products.json), knowledge-bootstrapped, size-gated (SS7d), site-planned, generated across docs/kb/reference/blog/products, quality-gated (truth-audit, S-90), and committed+pushed"
    - "If any genuine Python-specific extraction gap is found live during knowledge bootstrap (contrary to the no-gap expectation), it is investigated and fixed following the same real-evidence-first discipline as Missions 1 and 2 -- not assumed away"
  out_of_scope_items:
