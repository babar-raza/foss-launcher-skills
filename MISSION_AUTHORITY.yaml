    - "Any change to already-landed generic pipeline hardening verified EXISTS-AND-WIRED in prior missions (advisory_lock.py, session_ledger.py, llm_output_cache.py, pre-commit-audit.sh gates, site_planner.py step-scaling, knowledge/index.py live stats, the C++-specific Track A' fixes from MT012)"
    - "Re-litigating PDFCPP-CLUSTER-001 or PDFCPP-SNIPPET-PREMISE-001 (filed in backlog/BACKLOG.md during MT012, out of scope for this mission)"
  mandatory_acceptance_criteria:
