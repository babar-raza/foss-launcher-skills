mission_authority:
  mission_id: seo-keyword-production-integration
  mission_summary: "Turn the two real keyword datasets in keywords/ (7 Schema B Google Search Console files, weekly-refreshed; 14 Schema A LLM-suggested-keyword files, irregularly hand-run) into a governed, autonomous, non-regressive SEO improvement loop across all 5 aspose.org sites. Repairs the existing scripts/seo/ pipeline's confirmed governance bypasses (apply.py never enforced requires_human_review; never checked auto_updatable; never routed through no_downgrade_guard; the external repo's seo-apply.yml faked its audit step; an unrelated LLM 'PR Arbiter' auto-approved SEO PRs) and code defects (two independent incomplete Schema A/B filename allowlists; Schema A's exact-title dedup orphaning entries; a hardcoded '.NET platform' Gemini-prompt bias). Corrects confirmed technical-SEO gaps sitting next to that pipeline (31+ pages sharing the literal title 'Developer Guide'; 28+ KB FAQ pages sharing 'Frequently Asked Questions' via two governed skills that silently disagree on the template; seoTitle populated on 3,455 real, differentiated blog posts but rendered by zero themes; themes/docs emitting zero hreflang across ~38 locale trees per family; products.aspose.org emitting zero canonical tag; blog's Open Graph/Twitter templates existing but never invoked; KB FAQ pages rendering HowTo schema instead of FAQPage). Extends real search-demand signal into content generation (FAQ seeding, title clauses) and the real content-refresh pipeline (page_impact_assess.py -> body_refresh.py, order-only, never scope-changing) without weakening claim-grounding, evidence integrity, no-downgrade-guard, or auto_updatable protection. Governing plan produced via Claude Code Plan Mode across 4 rounds of forensic re-assessment (v1 rejected for a misattributed regression fix; v2 corrected it; v3 added concrete title formulas, independent-agent review, and refresh-pipeline-hooked traffic priority; v4 merged a sibling Schema A revival plan into one mission and restructured execution per d:/planning-execution-state-machine.md)."
  governing_plan_path: "C:\Users\prora\.claude\plans\check-keywords-this-data-curious-feather.md"
