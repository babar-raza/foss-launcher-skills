[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "foss-launcher-skills"
version = "0.2.0"
description = "Standalone skills system for FOSS product documentation generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
scout = [
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.13",
    "tree-sitter-c-sharp>=0.23",
]
embed = [
    "requests>=2.28",
]
dev = [
    "pytest>=9",
    "pytest-mock>=3",
    "pytest-cov>=6",
    "hypothesis>=6.100",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
foss-audit     = "scripts.pipeline.commands.content.audit:main"
foss-check     = "scripts.check_setup:main"
foss-materialize = "scripts.materialize:main"
foss-verify    = "scripts.verify:main"
foss-decide    = "scripts.decide:main"
foss-validate  = "scripts.validate_skills:main"
foss-gate      = "scripts.local_gate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
exclude = ["tests*", "reports*", "docs*"]

[tool.setuptools.package-data]
"scripts" = ["*.yaml", "*.json", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "scout: tests requiring tree-sitter (may be slow or unavailable)",
    "integration: end-to-end integration tests using fixture data only",
]

[tool.coverage.run]
source = ["scripts"]
omit = [
    "scripts/translator/*",
    "scripts/seo/*",
]

[tool.coverage.report]
show_missing = true
# Current enforced threshold: 12% (matching CI --cov-fail-under=12).
# This is the honest current baseline. Target: 70% (tracked in backlog).
fail_under = 12
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
