# Per-language translation quality parameters.
#
# Schema:
#   language_tiers: named groups, each with:
#     locales: [list of ISO-639-1 codes]
#     min_ratio: minimum len(tgt_body) / len(src_body)
#     max_ratio: maximum len(tgt_body) / len(src_body)
#   default:
#     min_ratio: fallback for locales not in any tier
#     max_ratio: fallback for locales not in any tier
#
# Outside bounds = validation FAIL.
# To add a new locale: add its code to the appropriate tier's locales list.
# No Python code changes required.

language_tiers:
  tier1_latin:
    locales: [ca, cs, da, de, el, es, fi, fr, hr, hu, it, nl, no, pl, pt, ro, sk, sv]
    min_ratio: 0.5
    max_ratio: 2.0
  tier2_cjk:
    locales: [ja, ko, zh]
    min_ratio: 0.2
    max_ratio: 2.5
  tier2_rtl:
    locales: [ar, fa, he]
    min_ratio: 0.4
    max_ratio: 4.0
  tier3_extended:
    locales: [bg, hi, id, lt, lv, ms, ru, sr, th, tr, uk, vi]
    min_ratio: 0.3
    max_ratio: 3.0

default:
  min_ratio: 0.3
  max_ratio: 3.5
