# Metrics Callsite Registry for aspose.org Agent Metrics
# Slice 1 of Agent Metrics Integration (METRICS-PLAN-001 v7.1)
#
# This registry covers ONLY current professionalize transport call sites.
# Non-professionalize calls (Gemini, Ollama, M2M) are NOT registered here.
# They are documented in metrics_taxonomy.yaml non_professionalize_boundaries.
#
# No secrets. No API keys. No endpoint tokens.
# No future adoption or migration planning.

version: "1.0"
plan_version: "7.1"
date_created: "2026-05-06"
slice_0_evidence: "reports/metrics/discovery/aspose-org-callsite-reconciliation.json"

# ── Allowed capture methods ───────────────────────────────────────────────── #

allowed_capture_methods:
  - wrapper_native       # Uses ProfessionalizeClient directly
  - llm_router_native    # Routed through LLMRouter which uses ProfessionalizeClient
  - approved_adapter     # Existing code wrapped with metrics adapter shim
  - legacy_temporary     # Temporary ungoverned; must have follow-up taskcard
  - blocked              # Not allowed; CI will reject

