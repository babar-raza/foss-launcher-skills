  typescript:
    language: typescript
    class_kinds: [class_declaration, interface_declaration, type_alias_declaration, enum_declaration, abstract_class_declaration]
    class_kinds_note: "abstract_class_declaration added by TC-MT040-10 -- the exact gap this whole contract file exists to make un-repeatable for the next language/kind."
    func_kinds: [function_declaration, method_definition, arrow_function, public_field_definition, property_signature, method_signature, abstract_method_signature]
    module_kinds: [internal_module, module]
    declared_ignored_kinds:
      export_clause: "Named-export list syntax (export { X, Y }) -- import/export machinery, not a declaration."
      export_specifier: "Individual name inside an export_clause/export_statement -- not a declaration."
      import_clause: "Import statement internals -- _IMPORT_TYPES['typescript'] tracks the parent import_statement node, not this."
      import_specifier: "Individual name inside an import_clause -- not a declaration."
      lexical_declaration: "Top-level `export const X = ...` binding -- captured by a separate constants-extraction pass (TC-MT040-13), not tree_helpers' class/func/module maps."
      ambient_declaration: "`declare module/namespace/global {...}` -- a type-only ambient declaration with no runtime emission; not a real exported class/func/module."
      call_signature: "Interface/type call-signature member ((x: number): void), nested inside an already-handled interface_declaration -- not its own declaration."
      catch_clause: "Control flow (try/catch) -- not a declaration."
      construct_signature: "Interface/type construct-signature member (new (x): T), nested inside an already-handled interface_declaration -- not its own declaration."
      else_clause: "Control flow -- not a declaration."
      extends_clause: "`class X extends Y` sub-clause of an already-handled class_declaration -- not its own declaration."
      extends_type_clause: "`interface X extends Y` sub-clause of an already-handled interface_declaration -- not its own declaration."
      function_signature: "Overload/ambient signature-only function form (`function foo(x): void;`, no body) -- live-verified 0 occurrences in the real pdf/typescript and 3d/typescript clones; when present elsewhere it is a sibling of an already-counted function_declaration overload set, not a separate public symbol."
      generator_function_declaration: "Live-verified in pdf/typescript (fontsource.ts's `function* walk()`, imageembed.ts's `function* pngChunks()`) -- both are unexported, module-private helper generators, not part of the public API surface. Re-check if a future product exports a generator function directly."
      implements_clause: "`class X implements Y` sub-clause of an already-handled class_declaration -- not its own declaration."
      import_require_clause: "CommonJS-style `import x = require(...)` -- import machinery, not a declaration."
      index_signature: "Interface/type index-signature member ([key: string]: T), nested inside an already-handled interface_declaration -- not its own declaration."
      mapped_type_clause: "Mapped-type syntax ({ [K in Keys]: T }) -- a type-level construct, not a declaration."
      variable_declaration: "Legacy `var` binding (local or module scope) -- `export const`/`export let` are already captured via lexical_declaration (TC-MT040-13); same reasoning as this file's own net.declared_ignored_kinds.variable_declaration and rust.declared_ignored_kinds.let_declaration entries."
    doc_style: jsdoc
    install_parser:
      manifest_files: [package.json]
    package_managers: [npm, yarn, pnpm]
    foreign_prose_patterns:
      declared: true
      pattern_count: 6
    primary_language: typescript
    smoke_test_langs:
      declared: true
      value: [typescript, ts]
      smoke_test_py_matches: true
      code_syntax_check_py_matches: true
    kb_suffix:
      declared: true
      value: typescript
    trouble_platform: true
    coverage_policy:
      concrete_only: true
      concrete_only_note: >
        Flipped false -> true by TC-MT040-22 (G-TS-09): TS interfaces/type
        aliases are pervasive type-contract vocabulary (cells/typescript
        alone has 53 interfaces + 25 type aliases) -- without this every one
        of them counted as an "important class missing" coverage finding.
        _is_interface_entry() was also extended to recognize the real
        interface_declaration/type_alias_declaration/abstract_class_declaration
        kind strings TS extraction actually produces.
    case_convention: camelCase
    reachability_adapter:
      status: real
      detail: >
        _export_names_cached() resolves the package.json-declared entry
        point's barrel exports. Fail-safe by construction: both elements are
        None together whenever the entry point can't be found or its
        exports can't be safely, fully enumerated (unresolvable `export *`,
        namespace-qualified or CommonJS-style export) -- never a partial
        name set silently missing an unenumerable source.
      enforced: true
      enforced_note: "REACHABILITY_ENFORCED_PLATFORMS == frozenset({'typescript','javascript','nodejs'}) -- the ONLY platform of the 7 with enforcement on today (REFERENCE_FILTER_POLICY_VERSION 2)."
    format_recognizer_style:
      modes: [pascal_verb, camel_identifier]
      modes_note: "The only platform with BOTH modes: Pass 1e (universal) plus Pass 1g (TC-MT040-14, gated to language in ('typescript','javascript') only)."
    example_verification:
      max_tier: 3
      offline_tier: 1
      runner_module: typescript
      precommit_blocking: false
