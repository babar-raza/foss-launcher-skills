# LLM endpoint registry — single source of truth for all pipeline modules.
#
# Provider Priority Policy:
#   1. professionalize (primary) — always tried first
#   2. ollama (secondary) — fallback when primary unavailable
#
# Do NOT add providers without updating llm_router.py EndpointStatus enum.

providers:
  professionalize:
    priority: 1
    base_url: "https://llm.professionalize.com/v1"
    base_url_env: "GPT_OSS_ENDPOINT"           # env override takes precedence over base_url
    # 2026-07-25: PROFESSIONALIZE_API_KEY started returning HTTP 401 (auth_failed)
    # against llm.professionalize.com/v1 — confirmed via LLMRouter.probe(). LLM_API_KEY
    # and GPT_OSS_API_KEY both authenticate OK (live-probed same session); promoted
    # LLM_API_KEY to primary. GPT_OSS_API_KEY kept as fallback since it already works
    # too. Note the router only re-checks the fallback var when the primary is
    # empty/absent, not on a 401 from a stale-but-present key — swap the primary here
    # (not just add another var) if this ever needs reverting.
    api_key_env: "LLM_API_KEY"
    api_key_env_fallback: "GPT_OSS_API_KEY"    # checked when api_key_env is absent
    chat:
      endpoint: "/chat/completions"
      model: "gpt-oss"
      default_timeout: 90
      default_temperature: 0.0
      default_max_tokens: 8000
    embeddings:
      endpoint: "/embeddings"
      model: "qwen3-embedding-8b"
      default_timeout: 30
      embed_dimensions: 4096

  ollama:
    priority: 2
    base_url: "http://localhost:11434/v1"
    api_key_env: null
    preferred_models: ["llama3.2", "llama3.1", "mistral", "qwen2.5"]
    chat:
      endpoint: "/chat/completions"
      model: "llama3.2"
      default_timeout: 90
      default_temperature: 0.0
      default_max_tokens: 8000
    embeddings:
      endpoint: "/embeddings"
      model: "nomic-embed-text"
      default_timeout: 30
      embed_dimensions: 768
