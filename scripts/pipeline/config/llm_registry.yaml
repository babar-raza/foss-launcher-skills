# LLM endpoint registry — single source of truth for all pipeline modules.
#
# Provider Priority Policy:
#   1. professionalize (primary) — always tried first
#   2. ollama (secondary) — fallback when primary unavailable
#
# Do NOT add providers without updating llm_router.py EndpointStatus enum.

schema_version: 2

operation_profiles:
  general_chat:
    providers: [professionalize, ollama]
  general_embeddings:
    providers: [professionalize, ollama]
  index_build:
    providers: [professionalize]
  candidate_enrichment:
    providers: [professionalize]
  seo_recommendation:
    providers: [professionalize]

providers:
  professionalize:
    priority: 1
    base_url: "https://llm.professionalize.com/v1"
    base_url_env: "GPT_OSS_ENDPOINT"           # env override takes precedence over base_url
    # Ordered credential failover. The deprecated Professionalize-specific alias
    # remains last for transition compatibility; 401/403 rotates to the next alias.
    credential_aliases:
      - "LLM_API_KEY"
      - "GPT_OSS_API_KEY"
      - "LITELLM_KEY"
      - "PROFESSIONALIZE_API_KEY"
    retry:
      max_attempts: 2
      retry_statuses: [429, 500, 502, 503, 504]
    chat:
      endpoint: "/chat/completions"
      model: "gpt-oss"
      default_timeout: 90
      default_temperature: 0.0
      default_max_tokens: 8000
    embeddings:
      endpoint: "/embeddings"
      model: "qwen3-embedding-8b"
      default_timeout: 30
      # qwen3-embedding-8b defaults to 4096 but supports an explicit dimensions
      # request. The canonical client requests this registry contract on every call.
      embed_dimensions: 512

  ollama:
    priority: 2
    base_url: "http://localhost:11434/v1"
    credential_aliases: []
    preferred_models: ["llama3.2", "llama3.1", "mistral", "qwen2.5"]
    chat:
      endpoint: "/chat/completions"
      model: "llama3.2"
      default_timeout: 90
      default_temperature: 0.0
      default_max_tokens: 8000
    embeddings:
      endpoint: "/embeddings"
      model: "nomic-embed-text"
      default_timeout: 30
      embed_dimensions: 768
