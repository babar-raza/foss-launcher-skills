    notes: "GOVERNANCE: MT019 convergence-audit follow-up (2026-08-02, TC-MT019-03):
      atomic, enforced isolated git-plumbing commit. The sanctioned escalation
      for shared-.git/index contention was, until this tool existed, a 5-6-step
      MANUAL procedure (CLAUDE.md), hand-typed roughly 8 times across one
      session and producing at least one real mistake. Worse, the pre-commit
      Step 30 stale-file-regression check can only ever be enforced by a git
      HOOK, and git-plumbing exists specifically to bypass git commit (and
      therefore every hook) by construction -- CLAUDE.md's own protocol was
      an honor-system reminder to run the check manually first. This tool
      makes the check a mandatory, non-skippable first step of the one tool
      that performs read-tree/add-f/write-tree/commit-tree/push/ref-sync/
      retroactive-skill-run-record as ONE atomic operation, closing the
      enforcement gap instead of relying on a session remembering the
      manual sequence correctly every time."

