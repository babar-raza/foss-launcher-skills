      requires updating that mission's one row in the shared index (a routine
      operation, not the rare hardening pass Step 8 originally targeted) --
      without a lock, two sessions closing two different missions at once can
      lose one update to a last-write-wins race. Deliberately FileLock, not a
      TTL/heartbeat lock (the shape originally proposed): upserting one row is
      a quick single-process read-modify-write, never held across multiple
      agent tool calls."

