# Metrics Taxonomy for aspose.org Agent Metrics
# Slice 1 of Agent Metrics Integration (METRICS-PLAN-001 v7.1)
# Current professionalize call capture only. No future adoption planning.
# No secrets. No endpoint tokens. No API keys.

version: "1.0"
plan_version: "7.1"
date_created: "2026-05-06"

# ── Owner ─────────────────────────────────────────────────────────────────── #

agent_owner: "Babar Raza"

# ── Website Mapping ───────────────────────────────────────────────────────── #
# Verified in Slice 0: all subdomains map to "aspose.org" for posted website.

default_website_mapping:
  docs.aspose.org:
    website: "aspose.org"
    section: "Docs"
  blog.aspose.org:
    website: "aspose.org"
    section: "Blog"
  kb.aspose.org:
    website: "aspose.org"
    section: "KB"
  products.aspose.org:
    website: "aspose.org"
    section: "Products"
  reference.aspose.org:
    website: "aspose.org"
    section: "Reference"

website_sections:
  - "Docs"
  - "Blog"
  - "KB"
  - "Products"
  - "Reference"

# ── Products (Aspose family keys) ────────────────────────────────────────── #
# Source: content/products.aspose.org/en/ directory listing, verified 2026-05-06.

products:
  "3d": "Aspose.3D"
  barcode: "Aspose.BarCode"
  cad: "Aspose.CAD"
  cells: "Aspose.Cells"
  diagram: "Aspose.Diagram"
  drawing: "Aspose.Drawing"
  email: "Aspose.Email"
  finance: "Aspose.Finance"
  font: "Aspose.Font"
  gis: "Aspose.GIS"
  html: "Aspose.HTML"
  imaging: "Aspose.Imaging"
  medical: "Aspose.Medical"
  note: "Aspose.Note"
  ocr: "Aspose.OCR"
  omr: "Aspose.OMR"
  page: "Aspose.Page"
  pdf: "Aspose.PDF"
  psd: "Aspose.PSD"
  pub: "Aspose.PUB"
  slides: "Aspose.Slides"
  svg: "Aspose.SVG"
  tasks: "Aspose.Tasks"
  tex: "Aspose.TeX"
  words: "Aspose.Words"
  zip: "Aspose.ZIP"
