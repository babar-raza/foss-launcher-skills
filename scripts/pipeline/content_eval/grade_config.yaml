# Grade configuration for content_eval
# Changes to this file MUST be accompanied by an EVALUATOR_LOGIC_VERSION bump.
evaluator_logic_version: "14"

# Categories where any FAIL forces grade F
critical_categories:
  - FC  # forbidden_claims
  - PC  # platform_purity
  - TA  # type_accuracy

# Category-specific grade ceilings
# Format: category: {levels: [WARN, FAIL, or both], ceiling: max_grade}
category_ceilings:
  TA: {levels: ["WARN", "FAIL"], ceiling: "C"}
  FT: {levels: ["FAIL"], ceiling: "C"}
  CP: {levels: ["FAIL"], ceiling: "B"}
  NC: {levels: ["FAIL"], ceiling: "C"}
  SX: {levels: ["FAIL"], ceiling: "C"}
  AC: {levels: ["FAIL"], ceiling: "B"}
  FM: {levels: ["FAIL"], ceiling: "C"}
  MV: {levels: ["FAIL"], ceiling: "C"}
  DC: {levels: ["FAIL"], ceiling: "C"}
  CB: {levels: ["FAIL"], ceiling: "C"}  # code_block_api — activates when escalated to FAIL
  DL: {levels: ["FAIL"], ceiling: "C"}  # dead_internal_link — activates when escalated to FAIL
  VC: {levels: ["WARN", "FAIL"], ceiling: "C"}  # version_claim_check — version mismatch caps grade
  CF: {levels: ["WARN", "FAIL"], ceiling: "C"}  # capability_claim_check — capability mismatch caps grade
  SG: {levels: ["WARN"], ceiling: "C"}          # verify_signature — signature mismatch (WARN only until calibration passes)
