name: Pipeline Tests

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run pipeline tests with coverage
        run: |
          python -m pytest tests/ -x -q \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=12 \
            -m "not scout and not integration"
        env:
          KNOWLEDGE_ROOT: tests/fixtures/knowledge
          CONTENT_REPO_PATH: tests/fixtures

      - name: Generate release receipt
        run: python scripts/generate_release_receipt.py
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Commit release receipt to repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/release-receipts/
          git diff --staged --quiet || git commit -m "chore(receipt): update release receipt [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload release receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt
          path: docs/release-receipts/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [pipeline-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run integration tests (e2e pipeline)
        run: |
          python -m pytest tests/test_e2e_pipeline.py -v -q \
            --tb=short \
            -m "integration and not scout"
        env:
          KNOWLEDGE_ROOT: tests/fixtures/knowledge
          CONTENT_REPO_PATH: tests/fixtures

  security-scan:
    runs-on: ubuntu-latest
    # Security gates are blocking — bandit baseline is clean (nosec-annotated)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run SAST scan (bandit)
        run: python scripts/ci/checks/check_sast_bandit.py

      - name: Run dependency audit (pip-audit)
        run: python scripts/ci/checks/check_dependency_audit.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (smoke test — no push)
        run: docker build -t foss-launcher-skills:ci-test .

      - name: Verify image entry point is installed
        run: docker run --rm --entrypoint which foss-launcher-skills:ci-test foss-gate
