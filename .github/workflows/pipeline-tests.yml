name: Pipeline Tests

on:
  push:
    paths:
      - 'scripts/pipeline/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'scripts/pipeline/**'
      - 'tests/**'
  workflow_dispatch:

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run pipeline tests with coverage
        run: python -m pytest tests/ -x -q --cov=scripts --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=11 -m "not scout" --ignore=tests/test_e2e_pipeline.py
        env:
          KNOWLEDGE_ROOT: tests/fixtures/knowledge
          CONTENT_REPO_PATH: tests/fixtures

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    # Security gates are blocking � bandit baseline is clean (nosec-annotated)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run SAST scan (bandit)
        run: python scripts/ci/checks/check_sast_bandit.py

      - name: Run dependency audit (pip-audit)
        run: python scripts/ci/checks/check_dependency_audit.py
