# Page Inventory — Mandatory and Optional Pages Per Product
# Used by agents to verify product completeness
# Schema version: 1
schema_version: 1
updated: "2026-03-26"

# Global templates: apply to all products unless overridden
# Subdomain keys: docs, kb, blog, products, reference
# Each entry: {slug, page_role, mandatory: true/false, description}
global_templates:
  docs:
    - slug: getting-started/_index
      page_role: docs
      mandatory: true
      description: "Getting started overview"
    - slug: getting-started/installation
      page_role: docs
      mandatory: true
      description: "Installation instructions"
    - slug: getting-started/license
      page_role: docs
      mandatory: true
      description: "License information"
    - slug: developer-guide/_index
      page_role: docs
      mandatory: true
      description: "Developer guide overview"
    - slug: developer-guide/features
      page_role: docs
      mandatory: true
      description: "Key features reference"
  kb:
    - slug: faq
      page_role: faq
      mandatory: true
      description: "Frequently asked questions"
  products:
    - slug: _index
      page_role: products
      mandatory: true
      description: "Product landing page"
  blog:
    - slug: "introducing-{family}-foss-{platform}/index"
      page_role: blog
      mandatory: true
      description: "Product launch announcement blog post"
  reference:
    - slug: _index
      page_role: reference
      mandatory: false
      description: "API reference landing"

