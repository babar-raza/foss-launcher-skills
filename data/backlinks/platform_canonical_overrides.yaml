# platform_canonical_overrides.yaml — Canonical enterprise platform slug overrides
#
# Purpose: Map local platform slugs to different enterprise URL slugs when
# the enterprise site uses a different platform path than the local taxonomy.
#
# Schema:
#   overrides:
#     "{family}/{local_platform}":
#       target_platform: "{enterprise_platform_slug}"
#       http_verified: true|false   # REQUIRED: must be true for resolver to apply
#       verification_date: "YYYY-MM-DD"
#       verification_url: "https://..."
#       notes: "optional explanation"
#       source_subdomains: ["products.aspose.org", ...]   # OPTIONAL, see below
#
# Rules:
#   - ALL entries require http_verified: true AND verification_date to be applied.
#   - http_verified: false entries are recorded for documentation but NOT used.
#   - Override only the platform slug, never the family.
#   - Populate only from live HTTP 200 evidence -- never from assumption.
#
# source_subdomains (added 2026-08-26, RC-OVERRIDE-SCOPE, backlink-governance-
# redesign mission): which aspose.org SOURCE subdomains this override applies
# to when resolving THEIR backlink. Omit to default to ["products.aspose.org"]
# only -- this repo's actual, original policy per the "Policy decision" comment
# below, restated here because the resolver code previously did not enforce it
# (confirmed live: it applied every override to every source subdomain
# unconditionally, regardless of this field's absence). Only add an entry here
# when the override's OWN evidence (verification_url/notes) independently
# covers that additional source subdomain's target site too -- a
# products.aspose.com-only HTTP-200 check does not prove the same platform-slug
# substitution is correct on reference.aspose.com/docs.aspose.com/kb.aspose.com,
# which may structure their content differently (e.g. reference.aspose.com can
# publish multiple binding-implementation variants for one aspose.org platform
# that a simpler products.aspose.com product page never distinguishes -- see
# barcode/python below, the live incident that surfaced this gap).
#
# Sprint: BL-PLAT-P0-2026-05-26
#
overrides:
  # pdf/go -> go-cpp: docs.aspose.com/pdf/go/ returns 404; docs.aspose.com/pdf/go-cpp/ returns 200.
  # Also: products.aspose.com/pdf/go/ returns 404 (verified 2026-07-03); go-cpp is the canonical.
  # products.aspose.com/pdf/go-cpp/ returns 200 (verified 2026-07-03, commit bb68a63a22).
  # The ONE entry in this file with genuine, independent cross-subdomain
  # evidence (both docs.aspose.com AND products.aspose.com HTTP-verified
  # separately) -- source_subdomains reflects exactly that, not a default.
  pdf/go:
    target_platform: "go-cpp"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/pdf/go-cpp/"
    notes: "docs.aspose.com/pdf/go/ HTTP 404; docs.aspose.com/pdf/go-cpp/ HTTP 200 (2026-05-26). products.aspose.com/pdf/go/ HTTP 404; products.aspose.com/pdf/go-cpp/ HTTP 200 (2026-07-03, commit bb68a63a22)."
    source_subdomains: ["products.aspose.org", "docs.aspose.org"]

  # Policy decision (commit bb68a63a22, 2026-07-03): For products.aspose.com, all Python API
  # products that use the .NET runtime are exposed under the python-net slug, not python/.
  # HTTP HEAD verification conducted 2026-07-03 against live products.aspose.com:
  #   /cells/python-net/  -> 200 OK
  #   /email/python-net/  -> 200 OK
  #   /slides/python-net/ -> 200 OK
  #   /words/python-net/  -> 200 OK
  # Canonical python/ pages also return 200 but are the FOSS landing pages; enterprise pages
  # are consistently at python-net/ for these four families. Override scope: products.aspose.org
  # source pages only. This claimed resolve_backlink() already enforced that subdomain scope --
  # confirmed FALSE 2026-08-26 (RC-OVERRIDE-SCOPE): the code applied every override to every
  # source subdomain unconditionally, with no check at all. Now genuinely enforced via the
  # source_subdomains field (schema note above) -- every entry below intentionally omits it,
  # so all default to the products.aspose.org-only scope this comment always claimed.
  cells/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/cells/python-net/"
    notes: "products.aspose.com/cells/python-net/ HTTP 200. Policy: enterprise Python product uses python-net slug. Commit bb68a63a22."

  html/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-25"
    verification_url: "https://products.aspose.com/html/python-net/"
    notes: "products.aspose.com/html/python-net/ HTTP 200 (curl -L, MT009 html/python launch). Same python-net policy as cells/email/slides/words. reference.aspose.com already maps html/python -> python-net variant."

  email/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/email/python-net/"
    notes: "products.aspose.com/email/python-net/ HTTP 200. Policy: enterprise Python product uses python-net slug. Commit bb68a63a22."

  slides/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/slides/python-net/"
    notes: "products.aspose.com/slides/python-net/ HTTP 200. Policy: enterprise Python product uses python-net slug. Commit bb68a63a22."

  words/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/words/python-net/"
    notes: "products.aspose.com/words/python-net/ HTTP 200. Policy: enterprise Python product uses python-net slug. Commit bb68a63a22."

  # 3d/python -> python-net: products.aspose.com/3d/python/ returns 404 (verified 2026-07-03, TC-BL-010).
  # products.aspose.com/3d/python-net/ returns 200 (verified 2026-07-03).
  # Unlike cells/email/slides/words where /python/ also returns 200 (FOSS landing),
  # 3d/python/ simply does not exist — enterprise product is only at python-net.
  # RC-OVERRIDE-SCOPE (2026-08-26): docs.aspose.com has ONLY 3d/python-net (confirmed
  # live -- no competing bare 3d/python key), so docs.aspose.org is added to
  # source_subdomains -- no ambiguity to paper over, and 11 existing docs.aspose.org
  # pages already correctly use python-net.
  3d/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/3d/python-net/"
    notes: "products.aspose.com/3d/python/ HTTP 404. products.aspose.com/3d/python-net/ HTTP 200 (live verified 2026-07-03, TC-BL-010). Enterprise 3D Python product uses python-net slug."
    source_subdomains: ["products.aspose.org", "docs.aspose.org"]

  # RC-OVERRIDE-SCOPE live incident (2026-08-26): before source_subdomains scoping was
  # enforced, this products.aspose.com-only override was silently cross-applied to
  # reference.aspose.org's resolution too, on 26 real pages -- overriding their own
  # correct, pre-existing https://reference.aspose.com/barcode/python-java/ links to the
  # wrong .../barcode/python-net/. reference.aspose.com genuinely publishes BOTH
  # python-java and python-net variants for barcode (confirmed live, both HTTP 200) --
  # a real binding-implementation ambiguity this products.com-only evidence never covered,
  # so reference.aspose.org is deliberately NOT added to source_subdomains below.
  # docs.aspose.org is different: docs.aspose.com has ONLY barcode/python-net (confirmed
  # live -- no competing bare barcode/python key at all, unlike reference.aspose.com), so
  # there is no ambiguity to paper over there; docs.aspose.org's existing content already
  # correctly uses python-net, and removing the leak without adding this explicit scope
  # would have wrongly flagged 12 already-correct docs.aspose.org pages WRONG_TARGET.
  barcode/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-09"
    verification_url: "https://products.aspose.com/barcode/python-net/"
    notes: "products.aspose.com/barcode/python-net/ HTTP 200 (live verified 2026-07-09). Enterprise barcode Python product uses python-net slug."
    source_subdomains: ["products.aspose.org", "docs.aspose.org"]

  # pdf/python was missing from this file entirely (products.aspose.com.platforms in
  # data/aspose_com_targets.json has no pdf/python or pdf/python-net key at all, unlike
  # pdf/go and pdf/cpp which each got their own one-off manual-correction entries) -- found
  # live 2026-08-18 via readme-refresh's Enterprise Edition link, which was silently falling
  # back to the bare family page https://products.aspose.com/pdf/ for pdf/python only, while
  # every other Python product below already resolves to its real python-net bridge page.
  # RC-OVERRIDE-SCOPE (2026-08-26): NOT extended to docs.aspose.org, deliberately, unlike
  # barcode/3d above. docs.aspose.com's OWN bare "pdf/python" key redirects to
  # https://docs.aspose.com/pdf/python-java/ (HTTP 200) -- a genuinely different, ALSO-live
  # candidate, independent of and disagreeing with this override's python-net choice. This
  # is the same live-published-multiple-variants shape as barcode/reference.aspose.org, not
  # the barcode/3d-on-docs shape (no competing candidate). 14 docs.aspose.org/pdf/python
  # pages now correctly show WRONG_TARGET (previously incorrectly COMPLIANT via the leaked
  # override) -- an honest, correctly-flagged residual, not silently resolved either way.
  # Needs either real docs.aspose.com variant-authority data (TC7's AMBIGUOUS_PLATFORM_TARGET
  # machinery, currently only populated for reference.aspose.com) or a human decision, not a
  # mechanical pick here.
  pdf/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-08-18"
    verification_url: "https://products.aspose.com/pdf/python-net/"
    notes: "products.aspose.com/pdf/python/ HTTP 301 -> products.aspose.com/pdf/python-net/ HTTP 200 (live verified 2026-08-18, curl). products.aspose.com/pdf/python-java/ and /pdf/python-cpp/ also return 200 as real, distinct alternate bridge pages, but python-net is Aspose's own designated canonical (the bare python/ slug redirects there directly, a stronger signal than the cells/email/slides/words/html/3d/barcode precedent where python/ merely also 200s as a separate FOSS landing page). Same python-net policy as every other Python product in this file."
