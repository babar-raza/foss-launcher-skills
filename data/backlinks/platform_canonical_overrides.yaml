# platform_canonical_overrides.yaml — Canonical enterprise platform slug overrides
#
# Purpose: Map local platform slugs to different enterprise URL slugs when
# the enterprise site uses a different platform path than the local taxonomy.
#
# Schema:
#   overrides:
#     "{family}/{local_platform}":
#       target_platform: "{enterprise_platform_slug}"
#       http_verified: true|false   # REQUIRED: must be true for resolver to apply
#       verification_date: "YYYY-MM-DD"
#       verification_url: "https://..."
#       notes: "optional explanation"
#
# Rules:
#   - ALL entries require http_verified: true AND verification_date to be applied.
#   - http_verified: false entries are recorded for documentation but NOT used.
#   - Override only the platform slug, never the family or subdomain.
#   - Populate only from live HTTP 200 evidence -- never from assumption.
#
# Sprint: BL-PLAT-P0-2026-05-26
#
overrides:
  # pdf/go -> go-cpp: docs.aspose.com/pdf/go/ returns 404; docs.aspose.com/pdf/go-cpp/ returns 200.
  # Also: products.aspose.com/pdf/go/ returns 404 (verified 2026-07-03); go-cpp is the canonical.
  # products.aspose.com/pdf/go-cpp/ returns 200 (verified 2026-07-03, commit bb68a63a22).
  pdf/go:
    target_platform: "go-cpp"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/pdf/go-cpp/"
    notes: "docs.aspose.com/pdf/go/ HTTP 404; docs.aspose.com/pdf/go-cpp/ HTTP 200 (2026-05-26). products.aspose.com/pdf/go/ HTTP 404; products.aspose.com/pdf/go-cpp/ HTTP 200 (2026-07-03, commit bb68a63a22)."

  # Policy decision (commit bb68a63a22, 2026-07-03): For products.aspose.com, all Python API
  # products that use the .NET runtime are exposed under the python-net slug, not python/.
  # HTTP HEAD verification conducted 2026-07-03 against live products.aspose.com:
  #   /cells/python-net/  -> 200 OK
  #   /email/python-net/  -> 200 OK
  #   /slides/python-net/ -> 200 OK
  #   /words/python-net/  -> 200 OK
  # Canonical python/ pages also return 200 but are the FOSS landing pages; enterprise pages
  # are consistently at python-net/ for these four families. Override scope: products.aspose.org
  # source pages only (resolve_backlink checks subdomain before applying overrides).
  cells/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/cells/python-net/"
    notes: "products.aspose.com/cells/python-net/ HTTP 200. Policy: enterprise Python product uses python-net slug. Commit bb68a63a22."

  html/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-25"
    verification_url: "https://products.aspose.com/html/python-net/"
    notes: "products.aspose.com/html/python-net/ HTTP 200 (curl -L, MT009 html/python launch). Same python-net policy as cells/email/slides/words. reference.aspose.com already maps html/python -> python-net variant."

  email/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/email/python-net/"
    notes: "products.aspose.com/email/python-net/ HTTP 200. Policy: enterprise Python product uses python-net slug. Commit bb68a63a22."

  slides/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/slides/python-net/"
    notes: "products.aspose.com/slides/python-net/ HTTP 200. Policy: enterprise Python product uses python-net slug. Commit bb68a63a22."

  words/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/words/python-net/"
    notes: "products.aspose.com/words/python-net/ HTTP 200. Policy: enterprise Python product uses python-net slug. Commit bb68a63a22."

  # 3d/python -> python-net: products.aspose.com/3d/python/ returns 404 (verified 2026-07-03, TC-BL-010).
  # products.aspose.com/3d/python-net/ returns 200 (verified 2026-07-03).
  # Unlike cells/email/slides/words where /python/ also returns 200 (FOSS landing),
  # 3d/python/ simply does not exist — enterprise product is only at python-net.
  3d/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-03"
    verification_url: "https://products.aspose.com/3d/python-net/"
    notes: "products.aspose.com/3d/python/ HTTP 404. products.aspose.com/3d/python-net/ HTTP 200 (live verified 2026-07-03, TC-BL-010). Enterprise 3D Python product uses python-net slug."

  barcode/python:
    target_platform: "python-net"
    http_verified: true
    verification_date: "2026-07-09"
    verification_url: "https://products.aspose.com/barcode/python-net/"
    notes: "products.aspose.com/barcode/python-net/ HTTP 200 (live verified 2026-07-09). Enterprise barcode Python product uses python-net slug."
