mission_authority:
  mission_id: readme-refresh-publication-state-hardening-2026-09-02
  mission_summary: 'User-directed investigation (2026-09-02): 3d/python (aspose-3d-foss) was
    published to PyPI on 2026-08-29; does /readme-refresh (S-120) detect a package publication
    during regeneration, and if so does it enhance the candidate accordingly? Answer: NO on both
    counts. Publication state inside the skill is a static checked-in flag
    (data/package_registry.json, 3d/python backfilled published:false on 2026-08-01) that only a
    human applying the daily package_publish_watch proposal ever refreshes (proposals #67/#70/#72/#74
    have sat open since 2026-08-29). Nothing in the skill probes a registry live; the one gate that
    reads the flag (check_installation_matches_package_registry) was made ADVISORY on 2026-08-12
    precisely because the flag was found stale in both directions -- a data-freshness problem
    treated as a tiering problem. This mission makes publication state a live-probed, evidenced
    fact at plan time (static record = fallback with a named source), lets composition, badges,
    gates and the verify-examples runner consume that one fact, surfaces registry drift, then
    regenerates 3d/python through the hardened skill to AWAITING_REVIEW for manual review.'
