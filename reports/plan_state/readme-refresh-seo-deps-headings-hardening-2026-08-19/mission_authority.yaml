  mission_summary: 'User-reported investigation of 3 quality defects in reports/repo-presenter-regen-full/3d/net/readme.md
    (Key Capabilities not using available SEO keywords from keywords/3d.json; Dependencies
    section thinner/less structured than recently-improved pdf/* candidates; Additional
    Examples with no per-example headings), with an explicit mandate to fix the governing
    readme-refresh (S-120) machinery, not just hand-edit the one candidate. All 3 confirmed
    real by direct source inspection. Investigation additionally surfaced a 4th, larger,
    portfolio-wide root cause the user did not name: dependency_extract.py''s native_system
    category (feeding the mandatory "### Native and System Requirements" Dependencies
    subsection) is populated for exactly 1 of 7 ecosystems (Go) -- .NET/Rust/Python/npm/Maven
    have zero native/language-version extraction despite the type system and rendering
    contract already existing. On explicit user follow-up ("deepreassess", production
    standard, no shortcuts), scope was confirmed to include all 4 defects plus a durable,
    cross-rerun-consistent design (a checks-module-currency staleness tripwire, since
    3d/net''s own "audit_portfolio -> clean:true" result from earlier today, 2026-08-19,
    was true only against the checks that existed at that moment -- nothing in the system
    currently flags that a candidate''s "clean" certification has gone stale relative to
    checks added since). This mission is standalone: the existing readme-disposition-remediation-2026-08-18
    mission is explicitly out of scope for touching readme_refresh_checks.py/readme_refresh_run.py
    or reports/repo-presenter-regen-full/ (its own mission_authority.yaml out_of_scope_items),
    so this work cannot be filed under it. Root MISSION_AUTHORITY.yaml currently holds an
    unrelated, live mission (concurrent-toasting-biscuit, Phase 0 bootstrap) -- overwriting
    it would destroy that in-progress work, so this mission''s contract is written directly
    to its own reports/plan_state/ directory without ever touching the root file, following
    the exact precedent readme-disposition-remediation-2026-08-18 already established for
    the same reason.'
