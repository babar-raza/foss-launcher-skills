mission_authority:
  mission_id: MT025-2026-08-08-FORENSIC-BLIND-SPOT-HEAL-SKILLS
  mission_summary: "Build two new skills for the FOSS content generation system, formalizing
    a mission spec the operator pasted for conversion into a reusable, production-grade
    skill. S-122 blind-spot-audit: read-only, unaided (no-tooling) dual-pass review of
    cloned FOSS repos and generated content, sealed before any system tooling runs, then a
    system-tooling pass, a manual-vs-system blind-spot comparison matrix with a
    system_recall metric, root-cause analysis with layer attribution, a scored
    solution-options fix plan, and schema-5f taskcard emission via TaskcardStore. S-123
    forensic-heal-sprint: consumes a mission's bound taskcards and drives them through
    system-heal (pipeline/skill/governance layer, never content/ first) -- content-regen
    -- verify -- harden -- reverify -- pilot-proof -- post-heal re-audit -- 12-mode
    independent adversarial review -- computed (never asserted) dual verdict, appending one
    row to a new tracked docs/governance/forensic-heal-history.md ledger (since reports/,
    .local/, and plans/ are all git-ignored and would otherwise leave no durable trail on a
    fresh clone). The exact mission this formalizes was already run once by hand, ungoverned,
    at .local/evidences/foss-manual-system-heal-v2-20260617/ (7 products, 1660 pages, 17
    manual findings, 4 taskcards, verdict SYSTEM_HEALED_WITH_LIMITATIONS, 6 deferred items
    including 17 unreviewed products) -- that run is the acceptance corpus for Wave 3's
    golden-fixture classifier test, and proof of the governance gap this mission closes
    (its own taskcards never reached reports/plan_state/, used a non-schema status, and
    closed with a card still at TODO and a dangling blocker, invisible to
    plan-health-watchdog). The pasted spec's own two invented governance schemes (custom
    09-taskcards/*.yaml; numbered 00-intake/../17-final/ evidence subdirectories) are
    explicitly rejected in favor of this repo's real mechanisms (taskcard schema 5f /
    TaskcardStore; flat evidence-<phase>.json under .local/evidences/<run_id>/), per
    AGENTS.md section 17's no-parallel-tracker rule."
  governing_plan_path: '<local-plan-cache>/typed-snuggling-peach.md'
