    taskcard (TC-41) plus resumes 4 of the 5 paused taskcards under their original IDs
    (TC-27, TC-17, TC-18, TC-14); TC-B-04 (pdf/python upstream-drift remediation) is
    explicitly deferred to its own future mission, per user decision. No push to any
    external product repo without a fresh, explicit, per-PR human go-ahead -- unchanged
    from both prior missions.

    '
