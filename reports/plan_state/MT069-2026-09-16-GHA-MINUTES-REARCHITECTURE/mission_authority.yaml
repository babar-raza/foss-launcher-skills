mission_authority:
  mission_id: MT069-2026-09-16-GHA-MINUTES-REARCHITECTURE
  mission_summary: 'Audit, re-architect, migrate, and stabilize GitHub Actions automation
    for the private Aspose/aspose.org repo to reduce GitHub-hosted Actions minute
    consumption, which the user reports is using a substantial share of the Aspose
    org''s included allowance and affecting other private repos. Full read-only recon
    this session found: 20 workflow files in .github/workflows/*.yml, all GitHub-hosted
    (18 ubuntu-latest-only, 1 with a windows-latest job pair, 1 with a soft-launched
    windows job), zero matrix strategies, zero composite actions, zero workflow_call
    reusable workflows. Aspose/aspose.org-workflows is a real, PUBLIC sibling repo
    already used for Option-B-style execution: it is the actual Hugo build+deploy
    engine for every subdomain and already hosts 5 SEO-pipeline workflow templates
    that check out Aspose/aspose.org via a scoped token, do work, and push results
    back via PR (never auto-commit) -- a proven pattern this mission reuses rather
    than re-designing. User confirmed (2026-09-16, this session) that all 20 workflows
    are CURRENTLY disabled_manually as an intentional emergency cost stopgap they
    applied themselves -- meaning every push(main) gate (content-governance-checks.yml,
    skill-governance.yml, etc.) is presently not enforcing anything; restoring correct
    gating without restoring the cost is a co-equal deliverable. The existing S-115
    workflow-harden skill already owns static correctness/security/hygiene review
    of .github/workflows/** + scripts/ci/** (including a CI-weight/caching probe)
    but explicitly disclaims cost/ billing measurement, self-hosted-runner migration,
    and public-repo migration -- this mission covers exactly that capability gap (filed
    as a bounded-oneoff gap-escalation report) while delegating the static-review
    slice to /workflow-harden rather than duplicating it. Mission covers Phase A (investigation
    -> execution-ready plan with per-workflow destination decisions and taskcards)
    only; Phase B (actual migration execution) is a separately-gated follow-on, not
    started by this mission''s completion.'
  governing_plan_path: plans/from_backlog/2026-09-16-gha-minutes-rearchitecture.md
  in_scope_outcomes:
  - Complete inventory of all 20 current .github/workflows/*.yml plus git-history
    deleted/renamed workflows, composite actions (none today), the 5 SEO templates
    deployed to Aspose/aspose.org-workflows, and confirmation that zero workflow_call
    reusable workflows exist
  - Written, evidence-cited record of the disabled_manually mass-disable as an intentional
    user action (2026-09-16), used as the baseline explanation before any usage number
    is trusted
  - Usage/billing dataset built from historical (pre-disable) run/job data via the
    repo-scoped gh api proxy, reconciled against Billing-UI figures the user supplies
    directly (this session's token lacks read:org/admin:org and the legacy Actions-
    billing REST endpoint is deprecated/410)
  - Per-workflow importance classification, 13-value destination decision, and a public/private
    data-boundary threat assessment for every workflow proposed for public or self-hosted
    execution, each in an evidence-backed dossier
  - Self-hosted runner architecture design (WSL2 + per-job container) targeting this
    session's own Windows 11 Pro dev machine, reserved only for push-gated native
    workflows -- design only, no runner registered/brought online in this mission
  - Execution-ready taskcards for every workflow, mapped to its destination decision
  - check_plan_taskcard_completeness.py passes against this mission's governing plan
    and reports/plan_state/MT069-2026-09-16-GHA-MINUTES-REARCHITECTURE/taskcards.jsonl
    before Phase A is declared plan-ready
  out_of_scope_items:
  - 'Any change to Aspose/aspose.org-workflows''s package-registry-driven deploy-trigger/
    change-detection logic (detect_changes.py and related) -- owned by MT066''s PKGINSTALL-DEPLOY-TRIGGER-3LAYER-FIX
    taskcard (status: READY, not yet started as of 2026-09-16) until that taskcard
    closes or is explicitly reconciled with this mission'
  - Phase B execution (actual migration/canary waves) -- gated behind Phase A being
    complete, independently reviewed, and every mandatory_acceptance_criteria item
    resolved; must not start automatically in the same session/plan that completes
    Phase A
  - Merging any PR against Aspose/aspose.org-workflows, or authorizing any live production
    deployment cycle there -- inherited repo-wide norm (also declared by MT062 and
    MT066), not unique to this mission
  - Registering or bringing online any self-hosted runner -- Phase A produces a design
    only
  - Rotating or regenerating any secret (GH_TOKEN, LITELLM_KEY, GOOGLE_API_KEY, etc.)
    discovered during the public/private threat assessment -- recommendation only,
    per S-115's own existing 'no secret rotation' hard limit, which this mission inherits
  - Re-enabling any of the 20 currently-disabled workflows -- stays a Phase B decision
    per workflow, made from evidence, not a side effect of this mission's investigation
  mandatory_acceptance_criteria:
  - Every one of the 20 current workflows (plus every deleted/renamed one found in
    git history) has a dossier with a cited destination decision -- none left at INSUFFICIENT_EVIDENCE
    without a stated reason
  - Usage/billing figures are reconciled against a real org-level source (the user's
    Billing UI export), not the repo-scoped run/job-duration proxy alone
  - Destination decisions recommending MOVE_EXECUTION_TO_PUBLIC_REPO or CENTRALIZE_CODE_PUBLICLY_BUT_KEEP_PRIVATE_EXECUTION
    each cite a completed threat assessment naming every secret/credential/data class
    exposed
  - Independent review of dossiers + destination decisions + threat assessment completed
    with no open CONFIRMED findings before Phase A is marked plan-ready
  - 'No duplicated static-review effort: the inventory taskcard cites an existing
    or freshly-run reports/sprint/workflow-harden-{date}/ bundle rather than re-deriving
    S-115''s own 8-dimension probe results'
  human_authority_boundaries:
  - Merging any PR against Aspose/aspose.org-workflows (repo-wide norm; this mission
    may propose/branch but never merge)
  - Providing the org Billing UI usage figures (user opted to pull these directly
    rather than granting broader token scope, 2026-09-16)
  - 'Choosing/owning the self-hosted runner machine identity (user confirmed 2026-09-16:
    this session''s own Windows 11 Pro dev machine)'
  - Approving Phase B start -- explicit, separate from Phase A completion
  - Force-taking-over a locked+open root MISSION_AUTHORITY.yaml incumbent if the root
    occupant changes before future work in this mission resumes -- escalate, do not
    auto-force
  - Confirming whether the four auto-commit watcher bots (upstream-monitor.yml, maven-publish-watcher.yml,
    install-literal-sweep.yml, package-publish-watch.yml) may convert to PR-gated-merge
    (required for a clean public-repo migration) or must stay closed-loop in the private
    repo permanently
