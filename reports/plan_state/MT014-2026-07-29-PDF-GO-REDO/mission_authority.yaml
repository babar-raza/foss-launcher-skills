mission_authority:
  mission_id: MT014-2026-07-29-PDF-GO-REDO
  mission_summary: 'Redo pdf/go (Aspose.PDF FOSS for Go) thoroughly across all 5 aspose.org
    subdomains using the Go interface/embedding extraction fix landed during the cells/go
    mission (MT011, commit d05c8943dd). That fix was already retroactively re-scouted
    against pdf/go (MT011 Phase 7, commit bb5a511e58): 42 classes'' methods/bases
    were corrected and their reference pages regenerated, but two things were deliberately
    left out of that narrow fix''s scope and tracked as separate backlog items this
    mission reconciles into one governed refresh_run.py cycle: (1) PDFGO-STALE-001
    -- ~63 unrelated new upstream classes/functions (OCR/LLM/Copilot/Markdown features)
    with zero content anywhere, plus corpus-wide evidence.model_sha staleness on pages
    outside the 42-class fix; (2) PDF-GO-REFRESH-001 -- the original 2026-07-14 launch
    refresh''s 3 unresolved truth-audit FAILs (ST-017, accepted/non-blocking; ST-022
    and ST-023, real unrelated pipeline defects). Phase 0 of this mission additionally
    built a new, reusable skill (mechanism-sweep, S-117) to formalize detecting this
    exact recurring pattern -- an extraction/enrichment improvement making other already-launched
    products stale independent of any upstream change -- for any future product/language,
    per explicit user request. Phase P fixed ST-022 (scripts/pipeline/extraction/formats.py:
    PascalCase verb+format-token method detection, e.g. Page.AddSVG/Document.LoadSVG)
    and ST-023 (scripts/pipeline/content_eval/evaluators/prose_truth.py: sentence-directionality
    resolution for export/import claims), both generically, both independently re-verified
    (446 tests passing, 0 regressions) and pushed. Remaining phases (K-X) execute
    the actual pdf/go content regeneration: knowledge re-scout picking up the 63 new
    classes, reference/docs/kb/blog/products regeneration and evidence-SHA refresh,
    full verification (refresh-oracle, regression-classification, re-audit proving
    ST-022/ST-023 closure), and governed commit.'
