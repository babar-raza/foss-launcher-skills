    the existing enum-underlying-type idiom
  - New extraction fixtures/tests proving interface, embedding, and enum shapes are
    independently correct
  - Dry-run regression proof against pdf/go's real clone-cache source (Annotation
    interface, CaretAnnotation embedding) with no modification to pdf/go's shipped
