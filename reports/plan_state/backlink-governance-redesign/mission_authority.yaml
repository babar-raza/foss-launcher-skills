    - "Repo working tree has substantial unrelated uncommitted changes across many files/missions as of 2026-08-21 (confirmed via git status). Per explicit user instruction 2026-08-21 ('dont worry about uncommitted work. workers responsible for that will commit them eventually'), this is not this mission's concern. This mission's own bootstrap (this file + taskcards.jsonl) is itself uncommitted, by explicit user instruction, pending a future deliberate commit decision."
