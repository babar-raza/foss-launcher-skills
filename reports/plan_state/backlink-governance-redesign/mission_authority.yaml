    - "Any change to the KB_ARTICLE_DEPTH hard block introduced by TC-HEAL-007 -- stays active"
  mandatory_acceptance_criteria:
    - "[NARROWED] _validate_llm_output() (or its successor) is the only reachable gate for anchor text on both write paths, verified by a wiring test (the AST-check approach is still valid but targets a smaller diff now that the validator itself pre-exists)"
    - "A page with 2 existing aspose.com links to the same host is classified DUPLICATE_SUBDOMAIN, not COMPLIANT (regression test against today's confirmed pass-through behavior -- still true as of 2026-08-21)"
    - "[ALREADY TRUE as of 2026-08-21, confirmed live -- keep as a standing regression test in the permanent corpus, not a build task] A URL that 301-redirects to a 200 destination is never stored as http_status: 200 in a fresh fetch_aspose_com_targets.py run (solved by unrelated mission MT022's _redirect_changed_path())"
    - "An end-to-end test proves refresh-product repairs a deliberately-broken backlink on a fixture product across all 5 subdomains, not just reference.aspose.org (confirmed still 0% true as of 2026-08-21)"
    - "Post-backfill, unscoped backlink_audit.py across all 5 subdomains shows the non-compliant count dropping from the corrected ~125+ (now known to be an undercount once duplicate-link locale fan-out is included -- 64 kb pages alone, not the 5 originally measured) to a small, explained remainder (documented exemptions only)"
    - "cells and words (the two originally reported defects) show COMPLIANT status with registry-exact anchor text, verified as a named regression case in the permanent test corpus -- reconfirmed unchanged/still broken as of 2026-08-21 (words has now carried zero backlink for 2.5+ months since its removal)"
    - "Family-root pages (words/_index.md and siblings) are reachable by audit.py/no_downgrade_guard.py, not unconditionally SKIPped (new criterion, TC16, from backlog G-29)"
    - "No change in this mission touches Layers 1/1.5/2/2.5/3's generation logic or the reference-class 1,271 live records (diff-scoped verification)"
    - "[NEW, per explicit user safety request 2026-08-21] TC15's content backfill never proceeds past its canary (cells+words only) or any per-subdomain stage without an explicit, recorded human approval; the real deploy trigger is confirmed (not assumed) and the manifest-based rollback mechanism is proven working on a throwaway page before any real production write"
  conflicts_found:
