mission_authority:
  mission_id: MT012-2026-07-28-PDF-CPP-LAUNCH
  mission_summary: Harden C++ snippet extraction (snippets.py's cpp branch, currently
    recognizing only gtest macros/test_-prefix/example-main) against pdf/cpp's real
    upstream test framework, and fix project_phase_store.py's blog_done checkpoint-integrity
    gap (a bare true with no fingerprint/skip-reason, currently exploited by cells/cpp's
    stale blog_done:true with zero blog content on disk). Launch pdf/cpp (Aspose.PDF
    FOSS for C++) across all 5 aspose.org subdomains, then retroactively correct cells/cpp's
    blog_done checkpoint lie (Phase 7) once pdf/cpp's own launch is committed and
    S-90-verified. Second of three sequential launches (cells/go -> pdf/cpp -> pdf/python)
    queued by the discover-more-products-to-launch mission (2026-07-28, commit 68336dd63f)
    and continued per MT011 (cells/go, CLOSED 2026-07-28, commits through 8d8c219f51).
    Each mission gets its own MISSION_AUTHORITY.yaml contract when it starts (this
    file governs Mission 2 only).
  governing_plan_path: plans/master-plan.md#Mission:-MT012-2026-07-28-PDF-CPP-LAUNCH
  current_phase: TRACK_A_PRIME_HARDENING
  in_scope_outcomes:
  - Live inspection of pdf/cpp's real upstream test directory (clone-cache or gh api
    tree listing) to confirm its actual test framework idiom(s) before writing any
    new snippets.py pattern -- do not assume Catch2/doctest/Boost.Test without checking
  - Extended snippets.py cpp branch recognizing the confirmed real idiom(s), alongside
    the existing gtest/test_-prefix/example-main recognition (must keep working, shared
    code used by every C++ product including cells/cpp)
  - 'New/extended C++ snippet extraction tests: existing gtest shape (no regression)
    plus the newly-added idiom(s)'
  - 'Checkpoint-integrity fix in project_phase_store.py: a future blog_done:true write
    requires either a real artifact fingerprint (reusing the existing __fingerprint
    mechanism used for newer entries) or an explicit blog_skipped:true with a real
    reason -- never a bare unverified true'
  - pdf/cpp registered (already active in data/products.json), knowledge-bootstrapped,
    size-gated (SS7d including the snippet threshold), site-planned, generated across
    docs/kb/reference/blog/products, quality-gated (truth-audit, S-90), and committed+pushed
  - 'Phase 7 (gated on pdf/cpp''s own launch commit + S-90 sign-off): resolve cells/cpp''s
    existing blog_done:true lie for real using the now-fixed checkpoint logic -- either
    generate its actually-missing blog content if it now clears the eligibility bar,
    or rewrite the checkpoint entry to an honest blog_skipped:true with a real reason;
    separate commit from pdf/cpp''s launch commit'
  out_of_scope_items:
  - pdf/python launch (Mission 3 -- separate MISSION_AUTHORITY.yaml contract when
    it starts)
  - cells/go and pdf/go (Mission 1 -- MT011, CLOSED 2026-07-28)
  - Re-scouting cells/cpp's knowledge/content beyond the narrow blog-checkpoint question
    in Phase 7 -- no broader cells/cpp refresh
  - Any change to the already-landed generic pipeline hardening (advisory_lock.py,
    session_ledger.py, llm_output_cache.py, pre-commit-audit.sh Steps 21-22, site_planner.py
    step-scaling, knowledge/index.py live stats) -- verified EXISTS-AND-WIRED in MT011,
    reused as-is
  - Forcing pdf/cpp's SS7d snippet threshold to pass via override if the real repo
    is genuinely light on recognizable tests after the extraction fix -- that is a
    FINDING to investigate and report honestly, not to force
  mandatory_acceptance_criteria:
  - Real upstream test-framework inspection is documented with concrete evidence (file
    paths, sample test code) before any snippets.py pattern is written
  - New/extended C++ snippet extraction tests pass, including a regression fixture
    proving the existing gtest shape is unaffected
  - pdf/cpp's SS7d gate (class_count>=5, total_claims>=20, snippet_count>=3, enrichment_status
    not error/absent) passes on real thresholds, not an override -- if snippet_count
    remains thin after the fix, this is investigated and reported as a FINDING before
    proceeding, not silently overridden
  - truth-audit hard-stops on FAIL for pdf/cpp; 0 FAIL required before Phase 5 commit
  - S-90 publish-readiness-review verdict is PUBLISH (or an explicitly justified equivalent)
    before commit
  - pdf/cpp launch commit pushed to origin/main via the documented GH_TOKEN URL, verified
    with git show --stat / git diff --stat matching intent
  - project_phase_store.py's blog_done write path requires a fingerprint or explicit
    skip reason -- verified live via pdf/cpp's own generated blog_done entry carrying
    one of the two, never a bare true
  - Phase 7 only starts after the above commit is confirmed pushed and S-90-verified;
    cells/cpp's phase_state.json entry ends with either a real fingerprint or an honest
    blog_skipped reason, in a separate commit from pdf/cpp's launch commit
  - Full scripts/pipeline/tests/ suite remains green (no regression) after both this
    mission's extraction/checkpoint changes and Phase 7's correction
  conflicts_found: []
  mission_locked: true
  _archive_status: closed
  _archived_at: '2026-07-29T14:06:56Z'
