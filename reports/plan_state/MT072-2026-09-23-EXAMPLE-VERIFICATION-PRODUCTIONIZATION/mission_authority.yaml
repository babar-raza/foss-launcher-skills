  - S-63, S-120 (all 7 platforms), S-49/launch_gate L-15, S-84/refresh_run, pre-commit,
    and knowledge promotion each dispatch through api.py, proven by the AST-based
    consumption check
  - a durable, git-tracked execution-proof ledger exists, modeled on baseline_ledger.py's
    append-only-JSONL + head-cache + O_EXCL-lock pattern
  - a completed, dated portfolio sweep covers every English public page with a code
    block (docs/kb/blog/reference/products, all 33 launched products) with 0 unclassified
    blocks
  - every defect the sweep confirms (44 known + 320 orphaned-fence + any new) is either
    fixed through a governed content skill with a real commit, or filed to backlog
    with a fresh ST id
