mission_authority:
  mission_id: MT072-2026-09-23-EXAMPLE-VERIFICATION-PRODUCTIONIZATION
  mission_summary: 'A read-only, first-principles audit (2026-09-18, re-confirmed
    unchanged at HEAD 2026-09-23) found that MT065-2026-09-06-EXAMPLE-VERIFICATION-CENTRALIZATION
    closed all 14 of its own taskcards while leaving the shared example-verification
    package (scripts/pipeline/lib/example_verification/) fully disconnected from production:
    no api.py/cli.py entry point exists, the only non-test external importer of runners/*.py
    is check_go_code_blocks.py''s helper functions, S-120 still dispatches to its
    own in-file python/typescript runners, registry.py still declares go/net/java/rust/cpp
    at max_tier=1/runner=None despite real runners existing for all five, 0 of 2,559
    snippet-index entries carry execution_proof, and CI runs only 1 of 18 verifier
    test files. A tier-1 sweep over ~3,862 English public code blocks found 44 real
    syntax errors on 43 pages plus a separate, never-filed finding of 320 files with
    an orphaned closing code fence. This mission builds the missing integration seam
    (api.py/cli.py), wires every named consumer (S-63, S-120 across all 7 platforms,
    S-49/launch_gate, S-84/refresh_run, pre-commit, knowledge promotion) through it,
    derives the registry from real runner code instead of a hand-mirrored claim, builds
    a durable execution-proof ledger, runs a full portfolio sweep over every English
    public page, and fixes the real defects the sweep and the prior audit confirmed
    -- closing RC1-RC7 named in the governing plan.

    '
  governing_plan_path: plans/from_backlog/2026-09-23-example-verification-productionization.md
  in_scope_outcomes:
  - lib/example_verification/api.py + cli.py exist as a pure composition over existing
    modules; check_module_consumption.py is upgraded from a substring heuristic to
    an AST reverse-import walker
