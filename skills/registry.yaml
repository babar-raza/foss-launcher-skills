schema_version: 1

# Single authoritative source of truth for all skill IDs, names, and script bindings.
# Checked by: python scripts/validate_skills.py
# Rules enforced:
#   - IDs must be unique across all entries
#   - Every skills/{name}.md must have a matching entry here
#   - Every .claude/commands/{name}.md must be byte-identical to skills/{name}.md (frontmatter stripped)
#   - Non-null script paths must exist on disk (relative to repo root)
#   - Internal skills (internal: true) must NOT appear in .claude/commands/
#
# ID assignment notes:
#   S-38 collision resolved: launch-product keeps S-38; truth-audit renumbered to S-47
#   S-42 collision resolved: category-fix keeps S-42; evidence-verify renumbered to S-46
#   S-40/S-41/S-42 frontmatter was missing id: field — authoritative IDs are here
#   New skills S-56+ assigned by foss-launcher (independent of aspose.org IDs)
#   Cross-reference: docs/id-mapping.md maps foss IDs to aspose.org IDs

