# docs/parity/source-anchors.yaml
#
# Source-of-truth anchor ledger for every artifact ported into this repo from
# aspose.org (or independently re-verified against it). This is what makes a
# future re-sync a `git diff <commit_sha>..HEAD -- <source_path>` instead of
# another full manual re-audit.
#
# Read by: tools/capability_sync/detect_source_drift.py
# Written by: an agent/session performing a sync, immediately after porting
# and testing an artifact -- never speculatively, never before the port is
# verified working in this repo.
#
# `source_repo_label` below is a LABEL only, never a literal filesystem path
# -- the actual clone location is resolved at check time via the
# $SOURCE_REPO_PATH environment variable (see detect_source_drift.py). This
# file must never contain a hardcoded aspose.org filesystem path.
#
# Design note (2026-08-29 sync): capability_id is populated only for entries
# that are also registered skills in skills/registry.yaml. Most ported
# artifacts (shared libraries, CI checks, reference docs) are not skills and
# have no capability_id -- capability.schema.json's skill-ID-keyed,
# additionalProperties:false structure isn't a natural fit for tracking
# non-skill infrastructure provenance, so this ledger is deliberately a
# separate, general-purpose file rather than an extension bolted onto the
# capability contract schema.
#
# HONEST LIMITATION: this ledger currently covers only the artifacts ported
# in the 2026-08-29 sync. The ~84 capabilities from the 2026-05-14 "parity
# complete" closure predate this mechanism and have NO anchor here -- their
# parity claims remain exactly as unverifiable as before this file existed.
# Backfilling them is tracked in TASK_BACKLOG.md (Workstream SYNC-2026-08-29).

